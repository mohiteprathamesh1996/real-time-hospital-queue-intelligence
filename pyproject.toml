[project]
name = "real-time-hospital-queue-intelligence"
version = "0.1.0"
description = "Real-time hospital capacity and queue intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "faker>=37.0.0",
    "jinja2>=3.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]